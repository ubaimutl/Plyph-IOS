name: Plyph

options:
  bundleIdPrefix: dev.ubai
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    REGISTER_APP_GROUPS: YES
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO

targets:
  Plyph:
    type: application
    platform: iOS
    sources:
      - path: Plyph
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ubai.Plyph
        PRODUCT_NAME: Plyph
        INFOPLIST_FILE: Plyph/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Plyph.entitlements
        INFOPLIST_KEY_KeychainAccessGroup: "$(AppIdentifierPrefix)dev.ubai.Plyph.shared"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: PlyphKeyboard
        embed: true

  PlyphKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: PlyphKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ubai.Plyph.Keyboard
        PRODUCT_NAME: PlyphKeyboard
        INFOPLIST_FILE: PlyphKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PlyphKeyboard.entitlements
        INFOPLIST_KEY_KeychainAccessGroup: "$(AppIdentifierPrefix)dev.ubai.Plyph.shared"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  PlyphTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlyphTests
    dependencies:
      - target: Plyph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ubai.PlyphTests
